name: CF wildcard DNS add
on:
  push:
    branches: [ claude/individual-account-image-selection-6v9260 ]
    paths: [ .github/workflows/cf-add-wildcard.yml ]
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZONE_ID: "7e5faed2d3d4d6da7aceb4ddde81a62b"
      IP: "34.104.233.35"
      T1: ${{ secrets.CF_TOKEN }}
      T2: ${{ secrets.CF_API_TOKEN }}
      T3: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      T4: ${{ secrets.CLOUDFLARE_TOKEN }}
      T5: ${{ secrets.CF_GLOBAL_KEY }}
      T6: ${{ secrets.CENT_CF_TOKEN }}
      T7: ${{ secrets.CF_DNS_TOKEN }}
    steps:
      - name: CF 토큰 직접 시도
        run: |
          ZONE_ID="$ZONE_ID"
          IP="$IP"
          TOKEN=""

          for T in "$T1" "$T2" "$T3" "$T4" "$T5" "$T6" "$T7"; do
            if [ -z "$T" ]; then continue; fi
            echo "시크릿 토큰 확인 중..."
            V=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
              -H "Authorization: Bearer $T")
            OK=$(echo "$V" | python3 -c "import sys,json; print('yes' if json.load(sys.stdin).get('success') else 'no')" 2>/dev/null || echo no)
            if [ "$OK" = "yes" ]; then
              TOKEN="$T"
              echo "유효한 토큰 발견"
              break
            fi
          done

          if [ -z "$TOKEN" ]; then
            echo "GitHub 시크릿에서 유효한 CF 토큰 없음"
            exit 1
          fi

          EXISTING=$(curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=*" \
            -H "Authorization: Bearer $TOKEN")
          COUNT=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result_info',{}).get('count',0))" 2>/dev/null || echo 0)

          if [ "$COUNT" -gt 0 ]; then
            echo "와일드카드 이미 존재"
            echo "$EXISTING" | python3 -c "import sys,json; [print(r['name'],r['content'],r['proxied']) for r in json.load(sys.stdin).get('result',[])]"
          else
            echo "생성 중..."
            RESULT=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"*\",\"content\":\"$IP\",\"ttl\":1,\"proxied\":true}")
            echo "결과: $RESULT"
            echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('SUCCESS' if d.get('success') else 'FAILED: '+str(d.get('errors')))"
          fi
